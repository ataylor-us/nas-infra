---
- name: Create provisioning user
  become: true
  ansible.builtin.user:
    name: "{{ iscsi_user }}"
    home: "{{ iscsi_home }}"
    create_home: true
    shell: /bin/bash
    system: true
- name: Authorize provisioning ssh key
  become: true
  ansible.posix.authorized_key:
    user: "{{ iscsi_user }}"
    key: "{{ iscsi_ssh_public_key }}"
    exclusive: true
- name: Grant provisioning user sudo access
  become: true
  ansible.builtin.template:
    src: sudoers.j2
    dest: "/etc/sudoers.d/{{ iscsi_user }}"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
