---
- name: Create ZFS keys directory
  become: true
  ansible.builtin.file:
    path: /etc/zfs/keys
    state: directory
    owner: root
    group: root
    mode: "0700"
# community.general.zpool does not seem to be idempotent
- name: Gather zpool facts
  become: true
  community.general.zpool_facts:
    properties: name
- name: Write zpool passphrase keyfiles from pass
  become: true
  ansible.builtin.copy:
    dest: "/etc/zfs/keys/{{ item.name }}.key"
    content: "{{ zpool_keys[item.name] }}\n"
    owner: root
    group: root
    mode: "0400"
  loop: "{{ zpools }}"
  no_log: true
- name: Create encrypted zpool mirrors
  become: true
  community.general.zpool:
    name: "{{ item.name }}"
    mountpoint: none
    pool_properties:
      ashift: "12"
    filesystem_properties:
      compression: lz4
      encryption: aes-256-gcm
      keyformat: passphrase
      keylocation: "file:///etc/zfs/keys/{{ item.name }}.key"
    vdevs:
      - type: mirror
        disks: "{{ item.disks }}"
  loop: "{{ zpools }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in ansible_zfs_pools | map(attribute='name')
- name: Enable monthly scrub timers
  become: true
  ansible.builtin.systemd:
    enabled: true
    name: "zfs-scrub-monthly@{{ item.name }}.timer"
    state: started
  loop: "{{ zpools }}"
  loop_control:
    label: "{{ item.name }}"
- name: Limit ZFS ARC to 8GB
  become: true
  ansible.builtin.copy:
    content: |
      options zfs zfs_arc_max=8589934592
    dest: /etc/modprobe.d/zfs.conf
    owner: root
    group: root
    mode: "0644"
  notify: Rebuild initramfs
- name: Create zfs-mount.service drop-in directory
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/zfs-mount.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: Configure zfs-mount.service to auto-load encryption keys
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/zfs-mount.service.d/load-keys.conf
    content: |
      [Service]
      ExecStartPre=/usr/bin/zfs load-key -a
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
- name: Create zfs datasets
  become: true
  community.general.zfs:
    name: "{{ item.name }}"
    state: present
    extra_zfs_properties: "{{ item.properties }}"
  loop: "{{ zfs_datasets }}"
  loop_control:
    label: "{{ item.name }}"
