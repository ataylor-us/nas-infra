---
- name: Create borgmatic directory
  become: true
  ansible.builtin.file:
    group: root
    mode: "0750"
    owner: root
    path: /etc/borgmatic.d
    state: directory
- name: Copy borgmatic config
  become: true
  ignore_errors: true
  register: borgmatic_config
  ansible.builtin.template:
    dest: /etc/borgmatic.d/config.yaml
    group: root
    mode: "0600"
    owner: root
    src: config.yaml.j2
  notify: Init local borg repo
# Idempotent random minute so they dont fire off at once
- name: Add borgmatic backup & prune job
  when: borgmatic_config is not failed
  become: true
  ansible.builtin.cron:
    day: "*"
    hour: "2,10,18"
    job: borgmatic create prune compact -v -1
    minute: "{{ 60 | random(seed=inventory_hostname) }}"
    month: "*"
    name: borgmatic create + prune
    user: root
    weekday: "*"
